<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSSexam01</title>
    <style>
        table {
            width:50%;
            height:50%;
            margin: 50px auto;    
            text-align:center;
            border: 2px solid black;
            border-collapse:collapse;
        }
        th,td{
            width: 60px;
            height:30px;
            background-color:grey;
            color:white;
        }
        .butt{
            display:block;
            font-weight:bold;
            width:50px;
            height:20px;
            margin:20px auto;
            padding: 10px 20px;
            color:white;
            text-decoration:none;
            border: outset 2px black;
            border-radius:5px;
            background-color:hotpink;
        }
        .butt:hover{
            opacity:0.8;
        }
       
    </style>

</head>
<body>
    <table border="2">
        <tr>
            <th>Id</th>
            <th>Product Name</th>
            <th>Product Price</th>
        </tr>
        <tr>
            <td>001</td>
            <td>Boots</td>
            <td>Rs.1800</td>
        </tr>
        <tr>
            <td>002</td>
            <td>Jerseys</td>
            <td>Rs.400</td>
        </tr>
        <tr>
            <td>003</td>
            <td>Socks</td>
            <td>Rs.550</td>
        </tr>
        <tr>
            <td>004</td>
            <td>Shorts</td>
            <td>Rs.500</td>
        </tr>
        <tr>
            <td>005</td>
            <td>Accessories</td>
            <td>Rs.200</td>
        </tr>
    </table>
    
        <a href="https://store.steampowered.com/" class="butt" target="_blank">CLICK</a>
        
   
</body>
</html>
