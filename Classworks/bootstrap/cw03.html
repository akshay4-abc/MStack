<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentDashboard</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container-fluid">
            <div class="row">
                <div class="col-md-12">
                    <ul class = "breadcrumb">
                        <li class = "breadcrumb-item"><a href = "#">Home</a></li>
                        <li class = "breadcrumb-item"><a href="#">Dashboard</a></li>
                        <li class = "breadcrumb-item active" aria-current = "page">My Courses</li>
                    </ul>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12 d-flex justify-content-center ">
                    <button type = "button" class = "btn btn-outline-success btn-md" style="margin-bottom:10px;">Start New Course </button>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12 d-flex justify-content-center">
                    <button type = "button" class = "btn btn-success">My Progress<span class = "badge badge-light" style="margin-left:5px;">3 courses</span></button>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12">
                    <div class="progress" style="margin-top:10px; height:30px;">
                        <div class="progress-bar progress-bar-striped progress-bar-animated" style="width:70%;">70%</div>
                    </div>
                </div>
            </div>
            <div class="row" style="margin-top:470px;">
                <div class="col-md-12 d-flex justify-content-center">
                    <ul class="pagination" style="margin-top:10px;">
                        <li class="page-item"><a class="page-link" href="#">Previous</a></li>
                        <li class="page-item"><a class="page-link" href="#">1</a></li>
                        <li class="page-item active"><a class="page-link" href="#">2</a></li>
                        <li class="page-item"><a class="page-link" href="#">3</a></li>
                        <li class="page-item"><a class="page-link" href="#">Next</a></li>
                    </ul>
                </div>
            </div>
    </div>
</body>
</html>
