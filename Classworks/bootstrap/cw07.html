<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravellersNow</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container">
        
        <div class="row">
            
            <div class="col-md-12">
                <h4 class="display-4 bg-primary text-light text-center p-0">TravellersNow</h4>
                <div id="box" class="carousel slide" data-ride="carousel">
                    <ul class="carousel-indicators">
                        <li data-target="#box" data-slide-to="0" class="active"></li>
                        <li data-target="#box" data-slide-to="1"></li>
                        <li data-target="#box" data-slide-to="2"></li>
                    </ul>
                    <div class="carousel-inner">
                        <div class="carousel-item active">
                            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTkb6ZSKVHYvLkWIHAhR75W35lSwvk0vyhQ8TtN7Om5oA&s=10" alt="Bali" class="img-fluid w-100" style="height: 90vh; object-fit: cover;">
                            <div class="carousel-caption">
                                <h1 class="text-white">Bali is a must-visit place with your partner!</h1>
                                <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#myModal"> Book Now</button>
                                
                            </div>
                        </div>
                        <div class="carousel-item">
                            <img src="https://www.travelandtourworld.com/wp-content/uploads/2026/04/istanbul-Turkey-.jpg" alt="Turkey" class="img-fluid w-100" style="height: 90vh; object-fit: cover;">
                            <div class="carousel-caption">
                                <h1 class="text-white">The beautiful land of Turkey</h1>
                                <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#myModal">Book Now</button>
                                
                            </div>
                        </div>
                        <div class="carousel-item">
                            <img src="https://lp-cms-production.imgix.net/2022-03/shutterstockRF_606110843.jpg" alt="Trivandrum" class="img-fluid w-100" style="height: 90vh; object-fit: cover;">
                            <div class="carousel-caption">
                                <h1 class="text-white">Cultural Trivandrum in Kerala</h1>
                                <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#myModal">Book Now</button>
                                
                            </div>
                        </div>
                       
                    </div>
                    <a class="carousel-control-prev" href="#box" data-slide="prev">
                        <span class="carousel-control-prev-icon"></span>
                    </a>
                    <a class="carousel-control-next" href="#box" data-slide="next">
                        <span class="carousel-control-next-icon"></span>
                    </a>
                    </div>
                </div>
            </div>
        </div>
    </div>    
</body>
<div class="modal" id="myModal">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h4 class="modal-title">BOOK NOW!</h4>
                <button type="button" class="close" data-dismiss="modal">
                    &times;
                </button>
            </div>

            <div class="modal-body">
                Book your slots and packages with an offer and convenient price!
                <br>
                Also get assistance from our travel team!
            </div>

        </div>
    </div>
</div>
</html>
