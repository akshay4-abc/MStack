<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentProfile</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12 text-center">
                <h1 class="display-4">Student Profile</h1>
            </div> 
            <div class="col-md-12 text-center">
                <blockquote class="blockquote">
                    <h1 class="display-6">Learning never exhausts the mind</h1>
                </blockquote>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12 text-center">
                <img src="https://static.vecteezy.com/system/resources/thumbnails/026/911/382/small/happy-student-boy-with-books-isolated-free-photo.jpg" alt="bob" class="rounded-circle" width="300px" height="300px">
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <table class="table table-striped table-bordered">
                    <thead class="thead-dark">
                        <tr>
                            <th>Subject</th>
                            <th>Marks</th>
                            
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>English</td>
                            <td>89</td>
                           
                        </tr>
                        <tr>
                            <td>Mathematics</td>
                            <td>78</td>
                            
                        </tr>
                        <tr>
                            <td>ComputerScience</td>
                            <td>97</td>
                           
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="alert  alert-success"><strong>Profile updated successfully!</strong></div>
</body>
</html>
