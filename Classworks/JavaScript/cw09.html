
<!DOCTYPE html>
<html>
<head>
    <title>Comment System</title>
</head>

<body>

    <h2>User Comment</h2>

    <p id="result"></p>

    <script>
        let comment = "My son is 12 years old. Our flat number is 45 and contact is 9876543210.";
        let numberFound = /\d+/.test(comment);
        let updatedComment = comment.replace(/\d+/g, "NUMBER");
        document.getElementById("result").innerHTML ="Number found: " + numberFound + "<br>" +"Updated comment: " + updatedComment;
    </script>

</body>
</html>
