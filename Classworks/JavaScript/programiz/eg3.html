<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Square root</title>
</head>
<body>
    <p id="ff"></p>
    <script>
        let x= parseInt(prompt("Enter to get square root: "));
        let y=Math.sqrt(x);
        document.getElementById("ff").innerHTML="The square root of "+x+" is "+y;

    </script>
    
</body>
</html>
