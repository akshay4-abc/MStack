<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="demo"></p>
    <script>
        const celcius=prompt("Enter Celcius:");
        const fahrenheit=(celcius*1.8)+32;
        document.getElementById("demo").innerHTML=("The fahrenheit value:"+fahrenheit);
    </script>
    
</body>
</html>
