<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AreaTriangle</title>
</head>

<body>
    <h2>Print the area of the triangle</h2>
    <p id="gg"></p>
    
    <Script>
        let h=parseInt(prompt("Enter the height of the triangle:"));
        let b=parseInt(prompt("Enter the base of the triangle:"));
        let a=(0.5*h*b);
        document.getElementById("gg").innerHTML="Area of the triangle is:"+ a;
    </Script>    
</body>
</html>
