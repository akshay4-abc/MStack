<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12 bg-danger">
                <h1 class="display-4 text-light text-center">STAR BAKES!</h1>
            </div>
        </div>
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" class="form-control" placeholder="Enter your name" id="name" name="name">
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" class="form-control" placeholder=" Enter your email" id="email" name="email">
        </div>
        <div class="form-group">
            <label for="feedback">Your Feedback:</label>
            <textarea class="form-control" rows="3" id="feedback" placeholder="Enter your feedback!"></textarea>
        </div>
        <p>What is your preferred contact method?</p>
        <div class="form-check-inline">
            <label class="form-check-label"><input type="checkbox" class="form-check-input" value="">Email</label>
        </div>
        <div class="form-check-inline">
        <label class="form-check-label"><input type="checkbox" class="form-check-input" value="">Phonenumber</label>
        </div>
        <div class="form-group">
            <label class="mt-2 " for="sel1">What would you like to order?</label>
            <select class="form-control bg-danger text-light" id="sel1">
                <option>Cookies</option>
                <option>Cakes</option>
                <option>Pastries</option>
            </select>
        </div>
        <p class="mt-3">How satisfied are you?</p>
        <div class="form-check-inline">
            <label class="form-check-label"><input type="checkbox" class="form-check-input" value="">1</label>
        </div>
        <div class="form-check-inline">
        <label class="form-check-label"><input type="checkbox" class="form-check-input" value="">2</label>
        </div>
        <div class="form-check-inline">
        <label class="form-check-label"><input type="checkbox" class="form-check-input" value="">3</label>
        </div>
         <div class="form-check-inline">
        <label class="form-check-label"><input type="checkbox" class="form-check-input" value="">4</label>
        </div>
        <div class="form-check-inline">
        <label class="form-check-label"><input type="checkbox" class="form-check-input" value="">5</label>
        </div>
        <div class="form-check-inline">
            <label class="form-check-label"><input type="checkbox" class="form-check-input" value="">6</label>
        </div>
        <div class="form-check-inline">
        <label class="form-check-label"><input type="checkbox" class="form-check-input" value="">7</label>
        </div>
        <div class="form-check-inline">
        <label class="form-check-label"><input type="checkbox" class="form-check-input" value="">8</label>
        </div>
         <div class="form-check-inline">
        <label class="form-check-label"><input type="checkbox" class="form-check-input" value="">9</label>
        </div>
        <div class="form-check-inline">
        <label class="form-check-label"><input type="checkbox" class="form-check-input" value="">10</label>
        </div>
        <div class="row">
            <div class="col-md-12 mt-3 d-flex justify-content-center">
                <button type="submit" class="btn btn-danger">Submit</button>
            </div>
        </div>
        
</body>
</html>
