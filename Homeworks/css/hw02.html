<!DOCTYPE html>
<html>
<head>
    <title>Product Card</title>

    <style>
        body {
            background-color: #a45151;
        }

        .card {
            width: 50%;
            max-width: 350px;
            height: 400px;
            border: 2px double blue; 
            border-radius: 15px;
            padding: 15px 20px; 
            margin: 30px auto; 
            background-color: skyblue;
            
        }

        .card img {
            max-width: 100%;
            min-width: 200px;
            border-radius: 5px;
        }

        .card h2 {
            margin: 15px 0 10px;
        }

        .card p {
            margin: 0;
        }
    </style>
</head>

<body>

    <div class="card">
        <br><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQmlVdPnBryK0-ynA5R2ZJlUn9RczM5_wnqnApxq2iB6g&s=10" alt="Product Image"><br>

        <h2>Wireless Headphones</h2>

        <p>Noise Pure Pods Wireless Open Ear Earbuds with AirWave™ Technology,Up-to 80H Playtime,Quad Mic with ENC,16mm Neodymium Dynamic Driver,Detachable Pure Band,BTv5.3 (Power Black)</p>
            
    </div>

</body>
</html>
