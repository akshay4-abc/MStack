<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: white;
        }

        h3{
            text-align: right;
            font-family: serif;
            font-size: 30px;
            color: darkred;
        }

        p{
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
            word-spacing: 10px;
        }

        table{
            width: 60%;
            margin: auto;
            border-collapse: collapse;
        }

        table, th, td{
            border: 2px solid black;
        }

        th, td{
            text-align: center;
            vertical-align: middle;
            padding: 10px;
        }

        a{
            text-decoration: none;
            color: blue;
        }

        a:hover{
            color: red;
        }

        .icons{
            text-align: center;
            font-size: 25px;
            margin: 15px;
            color: darkorange;
        }
    </style>
</head>

<body>

    <h3><i class="bi bi-cup-hot-fill"></i> Speed Restaurant</h3>

    <p>Welcome to Our Restaurant. Enjoy Delicious Food!</p>

    <div class="icons">
        <i class="bi bi-egg-fried"></i>
        &nbsp;
        <i class="bi bi-cake2-fill"></i>
    </div>

    <table>
        <tr>
            <th>Menu Item</th>
            <th>Price</th>
        </tr>

        <tr>
            <td>Dosa</td>
            <td>Rs.65</td>
        </tr>

        <tr>
            <td>Pizza</td>
            <td>Rs.240</td>
        </tr>

        <tr>
            <td>Cold Coffee</td>
            <td>Rs.60</td>
        </tr>
    </table>

    <br>

</body>
</html>
